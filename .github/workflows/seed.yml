name: seed-repo
on:
  workflow_dispatch:
  push:
    paths:
      - 'repo-seed.tar.gz'

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack skill library
        run: |
          set -e
          test -f repo-seed.tar.gz || { echo "no tarball, nothing to do"; exit 0; }
          tar -xzf repo-seed.tar.gz
          rm -f repo-seed.tar.gz .gitkeep
          rm -rf .github/workflows/seed.yml
          echo "--- resulting tree ---"
          find . -type f -not -path './.git/*' | sort

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "SOLO PROOF skill library v1.0 - 13 skills"
            git push
          fi
